<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>monkeytype clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Lexend:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="banana">🐒</span>monkeytype</div>
    <div class="top-right"><span>clone</span></div>
  </header>

  <main>
    <div class="config-bar" id="config-bar">
      <div class="config-group">
        <button class="config-btn active" data-mode="time">time</button>
        <button class="config-btn" data-mode="words">words</button>
      </div>
      <span class="sep">|</span>
      <div class="config-group" id="mode-options"></div>
    </div>

    <div id="test-area" tabindex="0">
      <div id="stats"><span id="live-wpm">0</span><span id="live-time"></span></div>
      <div id="word-area"></div>
      <div id="click-hint">click here or press any key to focus</div>
    </div>

    <div id="result-screen">
      <div class="result-main">
        <div class="result-big">
          <div class="num" id="res-wpm">0</div>
          <div class="lbl">wpm</div>
        </div>
        <div class="result-big">
          <div class="num" id="res-acc">0%</div>
          <div class="lbl">accuracy</div>
        </div>
        <div class="result-mini-grid">
          <div class="result-mini"><span class="num" id="res-raw">0</span><span class="lbl">raw</span></div>
          <div class="result-mini"><span class="num" id="res-chars">0/0/0/0</span><span class="lbl">characters</span></div>
        </div>
        <div class="result-mini-grid">
          <div class="result-mini"><span class="num" id="res-time">0s</span><span class="lbl">time</span></div>
          <div class="result-mini"><span class="num" id="res-mode">-</span><span class="lbl">mode</span></div>
        </div>
      </div>
      <svg id="result-graph" viewBox="0 0 620 140" preserveAspectRatio="none"></svg>
    </div>

    <div id="bottom-row">
      <button class="restart-btn" id="restart-btn" title="restart test">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-8 3.58-8 8s3.58 8 8 8a8 8 0 007.75-6M20 4v5h-5"/></svg>
      </button>
    </div>
  </main>

  <footer>
    <span><kbd>tab</kbd> + <kbd>enter</kbd> restart test</span>
    <span><kbd>esc</kbd> restart</span>
  </footer>
</div>
<script src="scrit.js"></script>

</body>
</html>
